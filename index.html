<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lakshmi | Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Jersey+20&family=Jersey+25&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="single-page">
        <section id="container-1" class="full-width-container">
            <div class="intro-text">
                <span class="greeting">Hi,</span><br>
                <span class="name">I'm Lakshmi</span>
            </div>

            <div class="typing-container">
                <span id="typing-text" class="jersey-20"></span><span class="cursor">|</span>
            </div>

            <div class="experience-section">
                <p class="experience-label">along with experience in</p>
                <div class="pill-grid">
                    <div class="pill-row">
                        <span class="pill">Computer Vision</span>
                        <span class="pill">ServiceNow Dev</span>
                    </div>
                    <div class="pill-row">
                        <span class="pill">Graphic Design</span>
                        <span class="pill">Marketing</span>
                        <span class="pill">Sales</span>
                    </div>
                </div>
            </div>
        </section>

        <section id="container-2" class="full-width-container">
            </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
